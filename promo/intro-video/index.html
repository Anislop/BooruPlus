<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BooruPlus intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300..900&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined&display=block" rel="stylesheet">
<style>
  :root { --accent: #F20B3D; --pink: #D24C91; --brand: #2A2227; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: Roboto, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .mi, .mo { font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal;
    text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
    font-feature-settings: 'liga'; user-select: none; }
  .mi { font-family: 'Material Icons Round'; }
  .mo { font-family: 'Material Icons Outlined'; }
  .abs { position: absolute; }
  img { display: block; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #bg { position: absolute; inset: 0; }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* Copy beside the phone */
  .copy { position: absolute; left: 170px; top: 540px; width: 760px; transform: translateY(-50%); }
  .copy > * { will-change: transform, opacity; }
  .ov { font-size: 18px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  .hl { font-size: 76px; font-weight: 700; letter-spacing: -.02em; line-height: 1.08; }
  .sb { font-size: 28px; line-height: 1.45; color: rgba(255,255,255,.6); margin-top: 26px; max-width: 680px; }

  /* Phone */
  #phone { position: absolute; left: 0; top: 0; width: 436px; height: 916px; transform-origin: 50% 50%; }
  #frame { position: absolute; inset: 0; border-radius: 58px; background: #0b0a0b;
    box-shadow: 0 0 0 1.5px #3b3338, inset 0 0 0 1px rgba(255,255,255,.06), 0 50px 120px rgba(0,0,0,.55); }
  .btn-side { position: absolute; right: -4px; width: 4px; border-radius: 0 3px 3px 0; background: #2c2629; }
  #screen { position: absolute; left: 12px; top: 12px; width: 412px; height: 892px; border-radius: 46px; overflow: hidden; background: #000; isolation: isolate; }
  .layer { position: absolute; left: 0; top: 0; width: 412px; height: 892px; overflow: hidden; }
  .t-ink54 { color: rgba(255,255,255,.54); }

  /* Home */
  .appbar { position: absolute; left: 0; top: 0; width: 412px; height: 96px; background: #000; }
  .tile { position: absolute; border-radius: 12px; border: 2px solid #8f8f8f; background: #141114; overflow: hidden; transform-origin: 50% 50%; }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  .panel { position: absolute; left: 0; width: 412px; height: 200px; background: rgba(0,0,0,.8); backdrop-filter: blur(16px); }
  .chip { position: absolute; height: 40px; border-radius: 8px; border: 1px solid rgba(242,11,61,.42); background: rgba(242,11,61,.06);
    display: flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; font-size: 15px; color: rgba(255,255,255,.87); white-space: nowrap; }
  .chip .mo, .chip .mi { font-size: 18px; color: var(--accent); }
  .field { position: absolute; height: 56px; border-radius: 16px; background: #0e0e0e; display: flex; align-items: center; }
  .field .lead { position: absolute; left: 16px; font-size: 24px; color: rgba(255,255,255,.7); }
  .field .trail { position: absolute; right: 16px; font-size: 24px; color: rgba(255,255,255,.7); }
  .field .text { position: absolute; left: 56px; right: 52px; font-size: 16px; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 2px; }
  .hint { color: rgba(255,255,255,.54); }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--accent); margin-left: 1px; }
  .ichip { height: 32px; border-radius: 8px; background: #141114; border: 1px solid rgba(255,255,255,.12);
    display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; font-size: 14px; font-weight: 500; }
  .ichip .mi { font-size: 16px; color: rgba(255,255,255,.54); }
  .suggest { position: absolute; background: #141114; border-radius: 10px; overflow: hidden; padding: 4px 0;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .suggest .row { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 14px; }
  .suggest .row.on { background: rgba(255,255,255,.06); }
  .suggest .cnt { font-size: 11px; color: rgba(255,255,255,.54); font-weight: 600; }
  .progress { position: absolute; left: 0; width: 412px; height: 3px; overflow: hidden; }
  .progress i { position: absolute; top: 0; height: 100%; }

  /* Viewer */
  .vchip { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #0e0e0e;
    font-size: 12px; color: rgba(255,255,255,.87); white-space: nowrap; }
  .vgroup { font-size: 11px; font-weight: 700; margin: 10px 0 6px; }
  .slabel { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }

  /* Drawer */
  .drawer { position: absolute; left: 0; top: 0; width: 326px; height: 892px; }
  .shortcut { position: absolute; width: 67px; height: 68px; border-radius: 14px; background: rgba(255,255,255,.05);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.87); }
  .shortcut .mi, .shortcut .mo { font-size: 22px; color: rgba(255,255,255,.8); }
  .siteRow { position: absolute; left: 8px; width: 302px; height: 58px; border-radius: 12px; display: flex; align-items: center; }
  .siteRow span { position: absolute; left: 74px; font-size: 17px; color: rgba(255,255,255,.87); letter-spacing: .01em; }
  .pix { image-rendering: pixelated; }

  /* Settings (themed through CSS variables) */
  #settings { --cv: 0,0,0; --pn: 20,17,20; --ik: 255,255,255; background: rgb(var(--cv)); color: rgb(var(--ik)); }
  #settings .card { position: absolute; left: 24px; width: 364px; border-radius: 16px; background: rgb(var(--pn)); }
  #settings .muted { color: rgba(var(--ik), .54); }
  .seg { position: absolute; top: 0; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .sw { position: absolute; width: 52px; height: 32px; border-radius: 16px; }
  .sw i { position: absolute; border-radius: 50%; }

  /* All sites */
  .fchip { position: absolute; height: 36px; border-radius: 8px; border: 1px solid rgba(242,11,61,.5); background: #2a0309;
    display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; font-size: 14px; white-space: nowrap; color: rgba(255,255,255,.92); }
  .fchip img { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; }
  .badge { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 5px; overflow: hidden; background: #000; }
  .badge img { width: 100%; height: 100%; object-fit: contain; }

  /* booruShorts */
  .shadow { text-shadow: 0 0 8px rgba(0,0,0,.54), 0 1px 2px rgba(0,0,0,.4); }
  .rail { position: absolute; width: 72px; display: flex; flex-direction: column; align-items: center; }
  .railLabel { font-size: 11.5px; font-weight: 600; color: #fff; }
  .spill { height: 30px; border-radius: 999px; border: 1.3px solid rgba(255,255,255,.62); padding: 0 12px; display: inline-flex; align-items: center;
    font-size: 13px; font-weight: 600; background: rgba(0,0,0,.18); white-space: nowrap; }

  /* Hold preview */
  .pchip { height: 26px; border-radius: 6px; background: rgba(0,0,0,.55); padding: 0 8px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pbtn { flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .pbtn .mi { font-size: 20px; }

  /* Logo rain */
  .cube { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; border-radius: 28%;
    box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.04); }
  .cube img { width: 62%; height: 62%; object-fit: contain; border-radius: 12%; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grain"></div>
  <div id="copies"></div>
  <div id="rain" class="abs" style="inset:0"></div>
  <div id="phone">
    <div id="frame">
      <div class="btn-side" style="top:190px;height:64px"></div>
      <div class="btn-side" style="top:290px;height:110px"></div>
    </div>
    <div id="screen"></div>
  </div>
  <div id="choose" class="abs" style="left:0;top:200px;width:1920px;text-align:center;pointer-events:none">
    <div id="chooseText" style="display:inline-block;font-size:92px;font-weight:700;letter-spacing:-.025em;text-shadow:0 10px 40px rgba(0,0,0,.55)">Choose with all these imageboards!</div>
  </div>
  <div id="end" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>
  <div id="fade" class="abs" style="inset:0;background:#000;opacity:0"></div>
</div>
<script src="media/data.js"></script>
<script src="tools/node_modules/matter-js/build/matter.min.js"></script>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Timing helpers. Every frame is a pure function of t (seconds).
// ---------------------------------------------------------------------------
const DURATION = 57.0;
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b, e = E.outCubic) => e(clamp((t - a) / (b - a)));
// Piecewise track: [[t, value], [t, value, ease], ...]
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    const [t0, v0] = keys[i - 1];
    if (t <= t1) return lerp(v0, v1, (e || E.inOutCubic)(clamp((t - t0) / (t1 - t0))));
  }
  return keys[keys.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// ---------------------------------------------------------------------------
// DOM helpers
// ---------------------------------------------------------------------------
function h(tag, attrs = {}, parent, html) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'style') Object.assign(el.style, v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v);
  }
  if (html != null) el.innerHTML = html;
  if (parent) parent.appendChild(el);
  return el;
}
const px = v => v + 'px';
const icon = (name, size, color, extra = {}, outlined = false) =>
  `<span class="${outlined ? 'mo' : 'mi'}" style="font-size:${size}px;color:${color};${Object.entries(extra).map(([k, v]) => k + ':' + v).join(';')}">${name}</span>`;
function show(el, op) { el.style.opacity = op; el.style.visibility = op <= 0.001 ? 'hidden' : 'visible'; }

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const SW = 412, SH = 892, PANEL_H = 200, FEED_TOP = 136;
const ACCENT = '#F20B3D', SAFE = '#63B5E8', CHAR = '#8BC8FF', COPY = '#FFA56B', ARTIST = '#E8A0FF', META = '#FFD166';
const SITES = [
  { key: 'safebooru', name: 'Safebooru', accent: '#63B5E8', surface: '#172A35', img: 'media/sites/safebooru.png', pix: true },
  { key: 'danbooru', name: 'Danbooru', accent: '#E8A16B', surface: '#35251D', img: 'media/sites/danbooru.png' },
  { key: 'gelbooru', name: 'Gelbooru', accent: '#B59AE5', surface: '#2B223A', img: 'media/sites/gelbooru.png', pix: true },
  { key: 'konachan', name: 'Konachan', accent: '#75C1E5', surface: '#182C35', img: 'media/sites/konachan.png', pix: true },
  { key: 'yandere', name: 'Yande.re', accent: '#E27B9B', surface: '#351F29', img: 'media/sites/yandere.png', pix: true },
  { key: 'e926', name: 'e926', accent: '#8DB9DE', surface: '#1E2B38', img: 'media/sites/e926.png' },
  { key: 'e621', name: 'e621', accent: '#E49A62', surface: '#38271E', img: 'media/sites/e621.png' },
  { key: 'sankaku', name: 'Sankaku Complex', accent: '#F2A25C', surface: '#3A2616', img: 'media/sites/sankaku.png' },
  { key: 'idolcomplex', name: 'Idol Complex', accent: '#E88BB5', surface: '#3A1A2A', img: 'media/sites/idolcomplex.png' },
  { key: 'rule34', name: 'Rule34', accent: '#9EAEE3', surface: '#22283B', img: 'media/sites/rule34.png' },
  { key: 'tbib', name: 'TBIB', accent: '#7CC48A', surface: '#1B2E22', img: 'media/sites/tbib.png', pix: true },
  { key: 'aibooru', name: 'AIBooru', accent: '#5FD3C6', surface: '#163330', img: 'media/sites/aibooru.png', pix: true },
  { key: 'nozomi', name: 'Nozomi', accent: '#E6C65C', surface: '#352E16', img: 'media/sites/nozomi.png' },
];
const siteImg = (s, size, extra = '') => `<img src="${s.img}" class="${s.pix ? 'pix' : ''}" style="width:${size}px;height:${size}px;${extra}">`;

// Scene starts (seconds)
const S = { s1: 0, s2: 4.4, s3: 8.6, s3b: 12.2, s4: 17.4, s5: 24.4, s6: 31.0, s7: 36.9, s8: 44.5, s9: 51.3 };
// All sites and booruShorts keep their original choreography, shifted later by this much.
const SHIFT = 6.9;
// Posts used by the post-detail and hide beats.
const VIEW_ID = 4730886, HIDE_ID = 4092702;

// ---------------------------------------------------------------------------
// Justified grid like the app's feed
// ---------------------------------------------------------------------------
function justify(items, width = SW - 24, target = 180, gap = 8) {
  const out = []; let row = [], sum = 0, y = 0;
  const place = (rowItems, hgt) => { let x = 0; for (const r of rowItems) { const w = r.ar * hgt; out.push({ id: r.it.id, it: r.it, x, y, w, h: hgt }); x += w + gap; } y += hgt + gap; };
  for (const it of items) {
    const ar = clamp(it.w / it.h, .55, 2.1);
    row.push({ it, ar }); sum += ar;
    if (sum * target + gap * (row.length - 1) >= width) { place(row, (width - gap * (row.length - 1)) / sum); row = []; sum = 0; }
  }
  if (row.length) place(row, Math.min(target, (width - gap * (row.length - 1)) / sum));
  return { rects: out, height: y };
}

// ---------------------------------------------------------------------------
// Build
// ---------------------------------------------------------------------------
const D = window.DATA;
const $ = id => document.getElementById(id);
const screen = $('screen'), phone = $('phone');
const R = {}; // element registry

function buildCopy() {
  const blocks = [
    { a: 4.75, b: 8.45, ov: 'Meet BooruPlus', logo: true, sb: 'An imageboard searching application.' },
    { a: 8.75, b: 12.1, ov: 'Browse', hl: 'Swipe through<br>endless posts.', sb: 'Every post keeps its own shape in one clean grid.' },
    { a: 12.3, b: 17.3, ov: 'Search', hl: 'Search with<br>booru tags.', sb: 'Pick tags from suggestions with live post counts.' },
    { a: 17.5, b: 20.9, ov: 'Post details', hl: 'Tap a post for<br>every detail.', sb: 'Favorite it, or tap a tag to search for more.' },
    { a: 21.0, b: 24.3, ov: 'Hide', hl: 'Hide what you<br>don’t want.', sb: 'Hold any post, slide to Hide, and let go.' },
    { a: 24.5, b: 30.9, ov: 'Settings', hl: 'Highly customizable<br>to your preferences.', sb: 'Themes, grid size, blur, gestures, and more.' },
    { a: 31.0, b: 36.8, ov: 'All sites', hl: 'Search once,<br>browse everywhere.', sb: 'One tag search across every website you use.' },
    { a: 37.0, b: 44.4, ov: 'booruShorts', hl: 'Swipe through<br>short videos.', sb: 'Vertical videos from every site. Double-tap to favorite.' },
  ];
  const wrap = $('copies');
  R.copies = blocks.map(b => {
    const el = h('div', { class: 'copy' }, wrap);
    const parts = [h('div', { class: 'ov' }, el, b.ov)];
    if (b.logo) parts.push(h('img', { src: 'media/brand/LogoFullColorWhite.png', style: { width: '600px', marginLeft: '-6px' } }, el));
    else parts.push(h('div', { class: 'hl' }, el, b.hl));
    parts.push(h('div', { class: 'sb' }, el, b.sb));
    return { ...b, el, parts };
  });
}

function statusBar(parent) {
  const sb = R.status = h('div', { class: 'abs', style: { left: 0, top: 0, width: px(SW), height: '32px', zIndex: 50, color: '#fff' } }, parent);
  h('div', { class: 'abs', style: { left: '30px', top: '9px', fontSize: '14px', fontWeight: 500 } }, sb, '9:41');
  h('div', { class: 'abs', style: { right: '28px', top: '8px', display: 'flex', gap: '4px' } }, sb,
    icon('signal_cellular_alt', 16, 'currentColor') + icon('wifi', 16, 'currentColor') + icon('battery_full', 16, 'currentColor', { transform: 'rotate(90deg)' }));
  h('div', { class: 'abs', style: { left: px(SW / 2 - 6), top: '10px', width: '12px', height: '12px', borderRadius: '50%', background: '#050505', boxShadow: '0 0 0 1.5px #1a1a1a' } }, sb);
  R.gestureBar = h('div', { class: 'abs', style: { left: px(SW / 2 - 54), bottom: '8px', width: '108px', height: '4px', borderRadius: '2px', background: 'rgba(255,255,255,.72)', zIndex: 50 } }, parent);
}

function buildSplash() {
  const L = R.splash = h('div', { class: 'layer', style: { background: '#000', zIndex: 40 } }, screen);
  R.splashLogo = h('div', { class: 'abs', style: { left: px((SW - 300) / 2), top: px(SH / 2 - 23), width: '300px', height: '46.6px' } }, L);
  h('img', { src: 'media/brand/LogoFullColorWhite.png', style: { width: '300px' } }, R.splashLogo);
  R.sweep = h('div', { class: 'abs', style: { inset: 0, mixBlendMode: 'screen',
    background: 'linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%)', backgroundSize: '300% 100%',
    WebkitMaskImage: 'url(media/brand/LogoFullColorWhite.png)', WebkitMaskSize: '100% 100%' } }, R.splashLogo);
}

function buildHome() {
  const L = R.home = h('div', { class: 'layer', style: { background: '#000', zIndex: 10 } }, screen);
  const vp = R.feedVp = h('div', { class: 'abs', style: { left: 0, top: px(FEED_TOP), width: px(SW), height: px(SH - FEED_TOP), overflow: 'hidden' } }, L);
  const mkFeed = items => {
    const c = h('div', { class: 'abs', style: { left: '12px', top: '6px', width: px(SW - 24) } }, vp);
    const lay = justify(items);
    const tiles = {};
    for (const r of lay.rects) {
      const t = h('div', { class: 'tile', style: { left: px(r.x), top: px(r.y), width: px(r.w), height: px(r.h) } }, c);
      h('img', { src: r.it.src }, t);
      tiles[r.id] = { el: t, r };
    }
    return { c, lay, tiles };
  };
  R.feedA = mkFeed(D.feed);
  const mikuOrder = [4912766, 4567204, 5097132, 4736449, 4732480, 4643969, 4299193, 4249376, 4923668, 4071302, 4730886, 5131060, 4918897, 4294953, 4082161, 4099114];
  R.feedB = mkFeed(mikuOrder.map(id => D.miku.find(p => p.id === id)));
  R.feedC = mkFeed(D.cinna);
  R.layC2 = Object.fromEntries(justify(D.cinna.filter(p => p.id !== HIDE_ID)).rects.map(r => [r.id, r]));

  const ab = h('div', { class: 'appbar' }, L);
  h('div', { class: 'abs', style: { left: '18px', top: '52px' } }, ab, icon('menu', 26, 'rgba(255,255,255,.87)'));
  h('div', { class: 'abs', style: { left: '74px', top: '50px', width: '30px', height: '30px', borderRadius: '7px', overflow: 'hidden', border: '1px solid rgba(99,181,232,.32)' } }, ab,
    `<img src="${SITES[0].img}" class="pix" style="width:100%;height:100%">`);
  h('div', { class: 'abs', style: { left: '116px', top: '49px', fontSize: '23px', fontWeight: 700 } }, ab, 'Safebooru');
  const fh = h('div', { class: 'abs', style: { left: 0, top: '96px', width: px(SW), height: '40px', background: '#000' } }, L);
  R.fhIcon = h('div', { class: 'abs', style: { left: '20px', top: '12px' } }, fh);
  R.fhLabel = h('div', { class: 'abs', style: { left: '46px', top: '13px', fontSize: '12px', fontWeight: 700, letterSpacing: '.15em', color: ACCENT } }, fh);
  h('div', { class: 'abs', style: { right: '18px', top: '12px', fontSize: '13px', color: 'rgba(255,255,255,.38)' } }, fh, '50 posts');
  R.progress = h('div', { class: 'progress', style: { top: '133px', background: 'rgba(99,181,232,.18)' } }, L);
  R.progressBar = h('i', { style: { background: SAFE, width: '160px' } }, R.progress);

  const pn = R.panel = h('div', { class: 'panel', style: { top: px(SH - PANEL_H) } }, L);

// ---------------------------------------------------------------------------
// Logo rain: a rigid-body simulation run once at boot, then replayed by time.
// ---------------------------------------------------------------------------
const RAIN_T0 = 45.75, RAIN_LEN = 6.6, RAIN_FPS = 60;
function buildRain() {
  const M = window.Matter, rand = rng(21);
  const engine = M.Engine.create({ gravity: { x: 0, y: 1, scale: .0026 }, enableSleeping: false });
  engine.positionIterations = 10; engine.velocityIterations = 8;
  const wall = { isStatic: true, friction: .8, restitution: .1 };
  M.Composite.add(engine.world, [
    M.Bodies.rectangle(960, 1080 + 60, 4000, 120, wall),
    M.Bodies.rectangle(-60, 0, 120, 4000, wall),
    M.Bodies.rectangle(1980, 0, 120, 4000, wall),
  ]);
  const wrap = $('rain');
  const cubes = [];
  const COPIES = 4;
  for (let c = 0; c < COPIES; c++) for (const s of SITES) cubes.push({ s });
  // shuffle so sites mix as they fall
  for (let i = cubes.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [cubes[i], cubes[j]] = [cubes[j], cubes[i]]; }
  cubes.forEach((c, i) => {
    c.size = 96 + Math.floor(rand() * 44);
    c.spawn = Math.round((.05 + i * .036 + rand() * .03) * RAIN_FPS * 2) ; // in substeps
    c.x = 130 + rand() * 1660;
    c.y = -c.size - rand() * 80;
    c.angle = rand() * Math.PI;
    c.spin = (rand() - .5) * .25;
    c.el = h('div', { class: 'cube', style: { width: px(c.size), height: px(c.size), background: c.s.surface, border: `2px solid ${c.s.accent}55`, visibility: 'hidden' } }, wrap,
      `<img src="${c.s.img}" class="${c.s.pix ? 'pix' : ''}">`);
  });
  const SUB = 2, steps = Math.ceil(RAIN_LEN * RAIN_FPS) * SUB;
  const frames = [];
  for (let k = 0; k <= steps; k++) {
    for (const c of cubes) if (c.spawn === k) {
      c.body = M.Bodies.rectangle(c.x, c.y, c.size, c.size, { chamfer: { radius: c.size * .26 }, restitution: .32, friction: .55, frictionAir: .006, density: .0018, angle: c.angle });
      M.Body.setVelocity(c.body, { x: (rand() - .5) * 3, y: 4 + rand() * 4 });
      M.Body.setAngularVelocity(c.body, c.spin);
      M.Composite.add(engine.world, c.body);
    }
    if (k % SUB === 0) frames.push(cubes.map(c => c.body ? [c.body.position.x, c.body.position.y, c.body.angle] : null));
    M.Engine.update(engine, 1000 / (RAIN_FPS * SUB));
  }
  R.rain = { cubes, frames };
}
function renderRain(t) {
  const local = t - RAIN_T0;
  const on = local >= 0 && t < S.s9 + .8;
  $('rain').style.visibility = on ? 'visible' : 'hidden';
  if (!on) return;
  const f = clamp(local * RAIN_FPS, 0, R.rain.frames.length - 1.001);
  const i0 = Math.floor(f), k = f - i0;
  const A = R.rain.frames[i0], B = R.rain.frames[i0 + 1] || A;
  R.rain.cubes.forEach((c, i) => {
    const a = A[i], b = B[i] || a;
    if (!a) { c.el.style.visibility = 'hidden'; return; }
    const x = lerp(a[0], b[0], k), y = lerp(a[1], b[1], k), ang = lerp(a[2], b[2], k);
    c.el.style.visibility = 'visible';

  R.feedA.c.style.opacity = 1 - aOut;
  R.feedA.c.style.visibility = aOut >= 1 ? 'hidden' : 'visible';

  const searched = t >= 14.4;
  R.fhIcon.innerHTML = icon(searched ? 'sell' : 'shuffle', 17, ACCENT);
  R.fhLabel.textContent = searched ? 'SEARCH RESULTS' : 'DISCOVER';
  const loads = [[14.36, 15.05], [20.0, 20.6]];
  const ld = loads.find(([a, b]) => t >= a && t < b);
  R.progress.style.visibility = ld ? 'visible' : 'hidden';
  if (ld) R.progressBar.style.left = px(lerp(-160, SW, ((t - ld[0]) / .7) % 1));

  // feed B: hatsune_miku results; the viewed tile grows on tap
  const scrollB = track(t, [[15.88, 0], [16.8, SCROLL_B, E.outCubic]]);
  R.feedB.c.style.transform = `translateY(${-scrollB}px)`;
  const bOut = P(t, 19.95, 20.15);
  R.feedB.c.style.visibility = t >= 14.9 && bOut < 1 ? 'visible' : 'hidden';
  R.feedB.c.style.opacity = 1 - bOut;
  renderFeedTiles(R.feedB, t, 14.95, (id, r, o) => {
    if (id === VIEW_ID) { o.sc = 1 + .05 * (P(t, 17.55, 17.65) - P(t, 17.65, 17.8)); o.op *= t >= 17.75 && t < 20.2 ? 0 : 1; }
  });

  // feed C: cinnamiku results after tapping the tag; one post is hidden
  R.feedC.c.style.visibility = t >= 20.4 ? 'visible' : 'hidden';
  const reflow = P(t, 23.4, 23.8, E.outCubic);
  renderFeedTiles(R.feedC, t, 20.5, (id, r, o) => {
    const r2 = R.layC2[id];
    if (r2 && reflow > 0) { o.x = lerp(r.x, r2.x, reflow); o.y = lerp(r.y, r2.y, reflow); o.w = lerp(r.w, r2.w, reflow); o.h = lerp(r.h, r2.h, reflow); }
    if (id === HIDE_ID) { o.sc = 1 + .08 * P(t, 21.35, 21.49); const gone = P(t, 23.2, 23.45, E.inCubic); o.op *= 1 - gone; o.sc *= 1 - .25 * gone; }
  });

  const hide = track(t, [[8.95, 0], [9.17, 1, E.outCubic], [11.2, 1], [11.42, 0, E.outCubic]]);
  R.panel.style.transform = `translateY(${hide * (PANEL_H + 10)}px)`;

  const focused = t >= 12.47 && t < 14.3;
  R.fieldBorder.style.opacity = focused ? 1 : 0;
  const chip = (name, k) => `<span class="ichip" style="transform:scale(${lerp(.7, 1, k)})"><span style="color:${CHAR}">${name}</span><span class="mi">close</span></span>`;
  let html;
  if (t < 12.47) html = '<span class="hint">Search tags, then press space</span>';
  else if (t < 13.84) html = `<span>${typed(t, 12.75, 'hatsune_m', 13)}</span>${caretOn(t) ? '<span class="caret"></span>' : ''}`;
  else if (t < 19.95) html = chip('hatsune_miku', P(t, 13.84, 14.06, E.outBack)) + (focused && caretOn(t) ? '<span class="caret" style="margin-left:6px"></span>' : '');
  else html = chip('cinnamiku', P(t, 19.95, 20.2, E.outBack));
  R.fieldText.innerHTML = html;
  const sg = Math.min(P(t, 13.05, 13.25), 1 - P(t, 13.84, 13.98, E.inCubic));
  show(R.suggest, sg);
  R.suggest.style.transform = `translateY(${(1 - sg) * 8}px)`;
  R.suggestRow0.classList.toggle('on', t >= 13.72 && t < 13.9);
}

function renderViewer(t) {
  const vis = t >= 17.72 && t < 20.2;
  show(R.viewer, vis ? 1 : 0);
  if (!vis) return;
  const open = P(t, 17.72, 18.08, E.outCubic);
  const close = P(t, 19.95, 20.18, E.inCubic);
  // hero: tile rect -> fitted media rect
  const r = R.feedB.tiles[VIEW_ID].r;
  const o = { x: 12 + r.x, y: FEED_TOP + 6 + r.y - SCROLL_B, w: r.w, h: r.h }, T = R.vTarget;
  const rx = lerp(o.x, T.x, open), ry = lerp(o.y, T.y, open), rw = lerp(o.w, T.w, open), rh = lerp(o.h, T.h, open);
  Object.assign(R.vMedia.style, { left: px(rx), top: px(ry), width: px(rw), height: px(rh), borderRadius: px(lerp(12, 0, open)) });
  R.vBg.style.opacity = P(t, 17.72, 17.95);
  R.vChrome.style.opacity = P(t, 17.85, 18.1);
  R.viewer.style.opacity = 1 - close;
  R.viewer.style.transform = `translateY(${close * 40}px)`;
  const sk = P(t, 18.5, 18.78, E.outCubic);
  R.vSheet.style.top = px(sheetTop(sk));
  R.vSheetBg.style.opacity = sk;
  $('vChevron').style.transform = `rotate(${180 * P(t, 18.5, 18.74)}deg)`;
  const fav = t >= 19.2;
  R.vHeart.textContent = fav ? 'favorite' : 'favorite_border';
  R.vHeart.style.color = fav ? '#FF77A8' : 'rgba(255,255,255,.38)';
  R.vHeart.style.transform = `scale(${fav ? lerp(1.6, 1, P(t, 19.2, 19.5, E.outBack)) : 1})`;
  R.vTagChip.style.background = t >= 19.72 && t < 19.98 ? 'rgba(139,200,255,.22)' : '#0e0e0e';
}

function renderPreview(t) {
  const tOpen = 21.6, tRelease = 23.1, pv = R.pv;
  const open = P(t, tOpen, tOpen + .22, E.outBack);
  const close = P(t, tRelease, tRelease + .18, E.inCubic);
  const vis = t >= tOpen && t < tRelease + .18;
  show(pv.card, vis ? 1 - close : 0);
  show(R.barrier, vis ? (t < tRelease ? P(t, tOpen, tOpen + .22) : 1 - close) : 0);
  if (!vis) return;
  const tl = R.feedC.tiles[HIDE_ID].r;
  const o = { x: 12 + tl.x, y: FEED_TOP + 6 + tl.y, w: tl.w, h: tl.h };
  const k = t < tRelease ? open : 1 - close;
  const rx = lerp(o.x, pv.target.x, k), ry = lerp(o.y, pv.target.y, k);
  const rw = lerp(o.w, pv.target.w, k), rh = lerp(o.h, pv.target.h, k);
  const s = Math.min(rw / pv.target.w, rh / pv.target.h);
  pv.card.style.transform = `translate(${rx + (rw - pv.target.w * s) / 2}px, ${ry + (rh - pv.target.h * s) / 2}px) scale(${s})`;
  const armed = t >= tRelease - .3 && t < tRelease + .2;
  pv.b.hide.style.background = armed ? ACCENT : 'rgba(0,0,0,.54)';
  pv.b.hide.style.transform = armed ? `scale(${1 + .04 * (1 - P(t, tRelease - .3, tRelease - .1))})` : 'none';
}

function renderDrawer(t) {
  const inS5 = t >= 24.58 && t < 31.7;
  const inS8 = t >= S.s8 && t < 46.8;
  const k = inS5 ? P(t, 24.6, 24.82, E.outCubic) : inS8 ? 1 : 0;
  show(R.drawer, k > 0 ? 1 : 0);
  show(R.scrim, k);
  R.drawer.style.transform = `translateX(${(k - 1) * 330}px)`;
  R.shortcuts[2].style.background = t >= 24.22 + SHIFT && t < 31.7 ? 'rgba(242,11,61,.16)' : 'rgba(255,255,255,.05)';
  R.drawerGear.style.transform = t >= 25.08 && t < 25.4 ? 'rotate(40deg)' : 'none';
  const ls = track(t, [[44.9, 0], [45.5, 230, E.outCubic]]);
  R.siteList.style.transform = `translateY(${-(inS8 ? ls : 0)}px)`;
}

const SET_SCROLL = 150;
function bannerH(t) { return BANNER_H * (P(t, 26.05, 26.27) - P(t, 29.85, 30.07)); }
function settingsScroll(t) { return track(t, [[27.88, 0], [28.35, SET_SCROLL, E.outCubic]]); }
function themeAt(t) {
  // [start, palette]: each change crossfades over 300 ms
  const steps = [[0, 'amoled'], [26.05, 'white'], [26.8, 'standard'], [27.45, 'amoled']];
  let cur = PALETTES.amoled, name = 'amoled';
  for (let i = 1; i < steps.length; i++) {
    const [ts, p] = steps[i];
    if (t >= ts) { cur = mixRGBPal(PALETTES[steps[i - 1][1]], PALETTES[p], P(t, ts, ts + .3)); name = p; }
  }
  return { pal: cur, name };
}
function mixRGBPal(a, b, k) { const o = {}; for (const key of Object.keys(a)) o[key] = mixRGB(a[key], b[key], k); return o; }
function renderSettings(t) {
  const vis = t >= 25.2 && t < 30.7;
  show(R.settings, vis ? 1 : 0);
  R.status.style.color = '#fff';
  R.gestureBar.style.background = 'rgba(255,255,255,.72)';
  if (!vis) return;
  const kin = P(t, 25.2, 25.55, E.outCubic), kout = P(t, 30.4, 30.7, E.inCubic);
  R.settings.style.transform = `translateX(${(1 - kin + kout) * SW}px)`;
  R.settings.style.boxShadow = '-20px 0 40px rgba(0,0,0,.45)';
  const { pal, name } = themeAt(t);
  const st = R.settings.style;
  st.setProperty('--cv', rgb(pal.cv)); st.setProperty('--pn', rgb(pal.pn)); st.setProperty('--ik', rgb(pal.ik));
  R.status.style.color = `rgb(${rgb(pal.ik)})`;
  R.gestureBar.style.background = `rgba(${rgb(pal.ik)},.72)`;
  const order = ['standard', 'white', 'amoled'];
  R.segs.forEach((s, i) => {
    const on = order[i] === name;
    s.style.background = on ? `rgb(${rgb(pal.seg)})` : 'transparent';
    s.innerHTML = (on ? `<span class="mi" style="font-size:18px;margin-right:6px">check</span>` : '') + ['Default', 'White', 'AMOLED'][i];
  });
  R.themeDesc.textContent = THEME_DESC[name];
  const bh = bannerH(t);
  R.banner.style.height = px(bh);
  R.setContent.style.top = px(96 + bh - settingsScroll(t));
  // blur explicit switch turns on
  const swk = P(t, 28.55, 28.72, E.outCubic);
  const ink = rgb(pal.ik);
  for (const [sw, k] of [[R.sw1, swk], [R.sw2, 0]]) {
    sw.sw.style.background = k > .5 ? ACCENT : `rgba(${ink},.06)`;
    sw.sw.style.border = `2px solid ${k > .5 ? ACCENT : `rgba(${ink},.38)`}`;
    const d = lerp(16, 24, k);
    Object.assign(sw.thumb.style, { width: px(d), height: px(d), left: px(lerp(6, 22, k)), top: px((28 - d) / 2), background: k > .5 ? '#fff' : `rgba(${ink},.5)` });
  }
  // columns slider 3 -> 4
  const v = lerp(3, 4, P(t, 29.0, 29.4, E.inOutCubic));
  const x = lerp(R.sliderTrack.x0, R.sliderTrack.x1, (v - 1) / 5);
  R.sliderActive.style.width = px(x - R.sliderTrack.x0);
  R.sliderThumb.style.left = px(x - 10);
  R.sliderThumb.style.boxShadow = t >= 28.95 && t < 29.5 ? '0 0 0 10px rgba(242,11,61,.18)' : 'none';
  R.colValue.textContent = Math.round(v);
  $('saveBtn').style.filter = t >= 29.72 && t < 29.9 ? 'brightness(1.15)' : 'none';
}

function renderAllSites(t) {
  const u = t - SHIFT; // original choreography time
  const k = P(u, 24.4, 24.75, E.outCubic);
  const vis = u >= 24.4 && u < 30.4;
  show(R.all, vis ? 1 : 0);
  if (!vis) return;
  R.all.style.transform = `translateX(${(1 - k) * SW * .3}px)`;
  R.all.style.opacity = k;
  R.allBorder.style.opacity = u >= 24.95 && u < 26.2 ? 1 : 0;
  let html;
  if (u < 24.95) html = '<span class="hint">Tags to search on every website</span>';
  else if (u < 25.9) html = `<span>${typed(u, 25.1, 'scener', 12)}</span>${caretOn(u) ? '<span class="caret"></span>' : ''}`;
  else html = `<span class="ichip" style="transform:scale(${lerp(.7, 1, P(u, 25.9, 26.1, E.outBack))})"><span style="color:rgba(255,255,255,.75)">scenery</span><span class="mi">close</span></span>`;
  R.allText.innerHTML = html;
  const sg = Math.min(P(u, 25.35, 25.55), 1 - P(u, 25.88, 26.0, E.inCubic));
  show(R.allSuggest, sg);
  R.allSuggestRow0.classList.toggle('on', u >= 25.78 && u < 25.95);
  show(R.allHint, 1 - P(u, 26.15, 26.3));
  R.allGrid.style.transform = `translateY(${-track(u, [[27.58, 0], [28.6, 300, E.outCubic]])}px)`;
  R.allTiles.forEach((el, i) => {
    const kk = P(u, 26.3 + i * .03, 26.65 + i * .03, E.outCubic);
    el.style.opacity = kk;
    el.style.transform = `scale(${lerp(.9, 1, kk)})`;
  });
}

function renderShorts(t) {
  const u = t - SHIFT;
  const enter = P(u, 29.95, 30.35, E.outCubic);
  const vis = u >= 29.95 && u < 38.0;
  show(R.shorts, vis ? 1 : 0);
  if (!vis) return;
  R.shorts.style.transform = `translateY(${(1 - enter) * SH}px)`;
  R.shorts.style.opacity = 1 - P(u, 37.7, 38.0);
  const page = track(u, [[32.12, 0], [32.42, .2, E.lin], [32.7, 1, E.outCubic], [34.92, 1], [35.22, 1.2, E.lin], [35.5, 2, E.outCubic]]);
  R.shortsPages.style.transform = `translateY(${-page * SH}px)`;
  const starts = [29.95, 32.42, 35.22];
  const cur = Math.round(page);
  R.shortPages.forEach((p, i) => {
    // still art gets a slow push-in and drift so each clip feels alive
    const local = Math.max(0, u - starts[i]);
    const k = clamp(local / CLIP_LEN);
    const dir = i % 2 ? -1 : 1;
    p.img.style.transform = `scale(${1.02 + .1 * k}) translate(${dir * 10 * k}px, ${-8 * k + Math.sin(local * 2.2) * 2}px)`;
    if (i === cur) R.scrub.style.width = px(SW * k);
  });
  const fav = u >= 33.72;
  const fp = R.shortPages[1].fav;
  fp.textContent = fav ? 'favorite' : 'favorite_border';
  fp.style.color = fav ? '#FF3B5C' : '#fff';
  fp.style.transform = `scale(${fav ? lerp(1.35, 1, P(u, 33.72, 34.0, E.outBack)) : 1})`;
  const bt = (u - 33.72) / .8;
  if (bt >= 0 && bt <= 1) {
    const s = bt < .2 ? 1.2 * E.outCubic(bt / .2) : lerp(1.2, 1, E.outCubic((bt - .2) / .2));
    R.burst.style.transform = `translate(${198 - 56}px, ${422 - 66}px) scale(${s}) rotate(${-8 * (1 - clamp(bt / .3))}deg)`;
    show(R.burst, bt < .7 ? 1 : 1 - (bt - .7) / .3);
  } else show(R.burst, 0);
}

function renderChoose(t) {
  const k = P(t, 46.6, 47.4, E.outCubic);
  const el = $('choose'), tx = $('chooseText');
  show(el, t < S.s9 + .7 ? k : 0);
  tx.style.transform = `translateY(${(1 - k) * 34}px) scale(${lerp(.95, 1, k)})`;
  tx.style.filter = k < 1 ? `blur(${(1 - k) * 12}px)` : 'none';
}

function renderEnd(t) {
  const k = P(t, S.s9, S.s9 + .7, E.inOutCubic);
  show($('end'), t >= S.s9 ? 1 : 0);
  if (t < S.s9) { $('fade').style.opacity = 0; return; }
  R.endPanel.style.transform = `translateY(${(k - 1) * 1140}px)`;
  const sw = P(t, 52.3, 53.2, E.inOutCubic);
  R.endSweep.style.backgroundPosition = `${lerp(110, -10, sw)}% 0`;
  R.endSweep.style.opacity = sw > 0 && sw < 1 ? .85 : 0;
  R.endGlow.style.opacity = P(t, 51.8, 52.6);
  const lk = P(t, 52.5, 53.1, E.outCubic);
  R.endLine.style.transform = `scaleX(${lk})`;
  R.endLine.style.opacity = lk;
  const tk = P(t, 52.7, 53.5, E.outCubic);
  R.endText.style.opacity = tk;
  R.endText.style.transform = `translateY(${(1 - tk) * 18}px)`;
  $('fade').style.opacity = P(t, 56.2, 57.0, E.inOutCubic);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function boot() {
  buildCopy();
  buildSplash();
  buildHome();
  buildViewer();
  buildPreview();
  buildDrawer();
  buildSettings();
  buildAllSites();
  buildShorts();
  buildTouch();
  statusBar(screen);
  buildRain();
  buildEnd();
  await Promise.all([
    document.fonts.load('24px "Material Icons Round"'),
    document.fonts.load('24px "Material Icons Outlined"'),
    document.fonts.load('400 16px Roboto'), document.fonts.load('600 16px Roboto'), document.fonts.load('700 16px Roboto'),
  ]);
  await document.fonts.ready;
  await Promise.all([...document.images].map(img => img.decode().catch(() => console.warn('img failed', img.src))));
  buildGestures(); // measures laid-out elements, so it runs after fonts load
  window.renderAt = t => { render(t); return true; };
  window.DURATION = DURATION;
  window.READY = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) render(+q.get('t'));
  else if (!q.has('render')) {
    const t0 = performance.now() - (+(q.get('from') || 0)) * 1000;
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  } else render(0);
}
boot();
</script>
