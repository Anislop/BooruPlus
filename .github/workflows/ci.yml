name: CI

on:
  pull_request:
  workflow_dispatch:
  # CD runs this before building on main and on version tags.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  dart:
    name: Analyze and Dart tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Debug build and native unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Compiles the Kotlin bridge and the vendored Java library; Flutter
      # also generates the ignored Gradle wrapper scripts here.
      - run: flutter build apk --debug

      - name: Native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload native test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: build/app/reports/tests/
          if-no-files-found: ignore
