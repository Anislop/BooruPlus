name: CD

# Every push to main publishes both APKs to the rolling `nightly` prerelease;
# a `v*` tag publishes them as a versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.3

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  debug:
    name: Debug APK
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Name the APK
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "dist/booruplus-${version}-${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: booruplus-debug-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Release APK
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Without these secrets the release APK falls back to the runner's
      # throwaway debug key, so it cannot update an installed earlier build.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release APK is signed with a debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/booruplus-${version}-${{ github.run_number }}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: booruplus-release-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish to GitHub Releases
    needs: [debug, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: booruplus-*-apk
          path: dist
          merge-multiple: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "BooruPlus $GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Latest build of main at $GITHUB_SHA. Debug and release APKs are attached separately."
